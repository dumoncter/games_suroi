[build]
builder = "dockerfile"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.suroi]
source = "."

[services.suroi.env]
NODE_ENV = "production"
PORT = "8000"

[services.suroi.build]
builder = "dockerfile"
