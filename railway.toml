# Suroi Multi-Server (Solo + Team)
[services.suroi]
source = "."
buildCommand = "pnpm build"

[services.suroi.env]
NODE_ENV = "production"
# Railway автоматически предоставит PORT

[services.suroi.build]
builder = "dockerfile"

[services.suroi.deploy]
startCommand = "node scripts/start-production.js"
healthcheckPath = "/api/serverInfo"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
