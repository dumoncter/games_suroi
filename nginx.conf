server {
    listen 0.0.0.0:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav|ogg|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        gzip_static on;
    }

    # API прокси на серверы Railway
    location /api/ {
        # Проксирование на соответствующий сервер в зависимости от домена
        if ($host ~* "solo") {
            proxy_pass https://suroi-solo-production.up.railway.app;
        }
        if ($host ~* "team") {
            proxy_pass https://suroi-team-production.up.railway.app;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket прокси на серверы Railway
    location /play {
        # Проксирование на соответствующий сервер в зависимости от домена
        if ($host ~* "solo") {
            proxy_pass https://suroi-solo-production.up.railway.app;
        }
        if ($host ~* "team") {
            proxy_pass https://suroi-team-production.up.railway.app;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck endpoint
    location /health {
        access_log /var/log/nginx/health.log;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Debug endpoint to check if nginx is working
    location /debug {
        access_log /var/log/nginx/debug.log;
        return 200 "nginx is running on port 8080\n";
        add_header Content-Type text/plain;
    }

    # Simple healthcheck
    location = /ready {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Основные файлы
    location / {
        # Simple healthcheck for Railway
        if ($http_user_agent ~* "Railway|Healthcheck") {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        try_files $uri $uri/ /index.html;
    }
}