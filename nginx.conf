server {
    listen 3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Кэширование статических ресурсов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav|ogg|webm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        gzip_static on;
    }

    # Обработка JavaScript модулей
    location ~* \.js$ {
        add_header Content-Type "application/javascript";
        add_header Access-Control-Allow-Origin *;
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Opener-Policy "same-origin";
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Обработка CSS файлов
    location ~* \.css$ {
        add_header Content-Type "text/css";
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # API прокси на серверы Railway
    location /api/ {
        # Проксирование на соответствующий сервер в зависимости от домена
        if ($host ~* "solo") {
            proxy_pass https://suroi-solo-production.up.railway.app;
        }
        if ($host ~* "team") {
            proxy_pass https://suroi-team-production.up.railway.app;
        }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket прокси на серверы Railway
    location /play {
        # Проксирование на соответствующий сервер в зависимости от домена
        if ($host ~* "solo") {
            proxy_pass https://suroi-solo-production.up.railway.app;
        }
        if ($host ~* "team") {
            proxy_pass https://suroi-team-production.up.railway.app;
        }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ПРОСТОЙ HEALTHCHECK - всегда возвращает 200 OK
    location = /status.txt {
        access_log /var/log/nginx/healthcheck.log;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Обработка HTML файлов
    location ~* \.html$ {
        add_header Content-Type "text/html";
        add_header Access-Control-Allow-Origin *;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Основные файлы - возвращаем index.html для всех запросов
    location / {
        try_files $uri $uri/ /index.html;
    }
}