<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <button onclick="testSolo()">Test Solo Server</button>
    <button onclick="testTeam()">Test Team Server</button>
    <div id="status"></div>
    <div id="log"></div>

    <script>
        function log(message) {
            document.getElementById('log').innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }

        function testSolo() {
            document.getElementById('status').textContent = 'Testing Solo Server...';
            const ws = new WebSocket('wss://suroi-solo-production.up.railway.app/play/0');

            ws.onopen = function() {
                log('✅ Solo Server: WebSocket connected successfully!');
                document.getElementById('status').textContent = '✅ Solo Server: Connected!';
                ws.close();
            };

            ws.onerror = function(error) {
                log('❌ Solo Server: WebSocket error - ' + error);
                document.getElementById('status').textContent = '❌ Solo Server: Error!';
            };

            ws.onclose = function(event) {
                log('🔌 Solo Server: WebSocket closed - Code: ' + event.code);
            };
        }

        function testTeam() {
            document.getElementById('status').textContent = 'Testing Team Server...';
            const ws = new WebSocket('wss://suroi-team-production.up.railway.app/play/0');

            ws.onopen = function() {
                log('✅ Team Server: WebSocket connected successfully!');
                document.getElementById('status').textContent = '✅ Team Server: Connected!';
                ws.close();
            };

            ws.onerror = function(error) {
                log('❌ Team Server: WebSocket error - ' + error);
                document.getElementById('status').textContent = '❌ Team Server: Error!';
            };

            ws.onclose = function(event) {
                log('🔌 Team Server: WebSocket closed - Code: ' + event.code);
            };
        }
    </script>
</body>
</html>
